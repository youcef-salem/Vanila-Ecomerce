<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atelier — Carefully made objects</title>
  <meta name="description" content="A boutique shop of carefully made objects from independent workshops across Europe.">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main>
    <section class="hero">
      <div class="hero-inner">
        <h1>Carefully made <em>objects</em><br>for everyday life.</h1>
        <p class="hero-lede">
          A small catalogue of pieces from independent workshops across Europe.
          Brass, linen, stoneware, walnut — chosen one at a time, kept in stock
          only as long as our makers can supply them.
        </p>
      </div>
      <div class="hero-meta">
        <span>Maison N°4 · Issue 2026</span>
        <span id="result-count">—</span>
      </div>
    </section>

    <section class="filters" aria-label="Filter products">
      <div class="filters-inner">
        <div class="search-box">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none"
               stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
               stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"/>
            <line x1="21" y1="21" x2="16.5" y2="16.5"/>
          </svg>
          <input id="search-input" type="search" placeholder="Search by name, material, or use…">
        </div>
        <div class="cat-pills" id="cat-pills" role="group" aria-label="Categories">
          <!-- filled by JS -->
        </div>
        <select class="sort-select" id="sort-select" aria-label="Sort">
          <option value="newest">Newest first</option>
          <option value="price-asc">Price · low to high</option>
          <option value="price-desc">Price · high to low</option>
          <option value="rating">Best rated</option>
        </select>
      </div>
    </section>

    <section class="shop-section">
      <div class="product-grid" id="product-grid">
        <!-- filled by JS -->
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script type="module" src="js/pages/shop.js"></script>
</body>
</html>
