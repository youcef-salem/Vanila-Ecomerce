<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin dashboard — Atelier</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main>
    <div class="admin-page" id="admin-root">
      <div class="admin-header">
        <div>
          <span class="eyebrow">Admin</span>
          <h1>Manage catalog</h1>
          <p class="muted" style="margin-top:0.5rem;">
            Add, edit, or remove items. Changes appear instantly in the shop.
          </p>
        </div>
      </div>

      <div class="admin-grid">
        <aside class="admin-form">
          <h3 id="form-title">Add a new product</h3>
          <form id="product-form" novalidate>
            <div class="field">
              <label for="name">Name</label>
              <input id="name" name="name" type="text" required>
            </div>

            <div class="field-row">
              <div class="field">
                <label for="price">Price (DZD)</label>
                <input id="price" name="price" type="number" step="0.01" min="0" required>
              </div>
              <div class="field">
                <label for="stock">Stock</label>
                <input id="stock" name="stock" type="number" min="0" required value="1">
              </div>
            </div>

            <div class="field">
              <label for="category">Category</label>
              <input id="category" name="category" type="text" required
                     placeholder="e.g. kitchen, ceramics, home">
            </div>

            <div class="field">
              <label for="image">Image URL</label>
              <input id="image" name="image" type="url"
                     placeholder="https://…">
            </div>

            <div class="field">
              <label for="tags">Tags (comma-separated)</label>
              <input id="tags" name="tags" type="text"
                     placeholder="brass, lighting, workspace">
            </div>

            <div class="field">
              <label for="description">Description</label>
              <textarea id="description" name="description" rows="4" required></textarea>
            </div>

            <div style="display:flex; gap:0.6rem;">
              <button id="form-submit" type="submit" class="btn btn-primary btn-block">Add product</button>
              <button id="cancel-edit" type="button" class="btn btn-ghost" hidden>Cancel</button>
            </div>
          </form>
        </aside>

        <div id="admin-table-wrap"></div>
      </div>
    </div>

    <template id="admin-not-authorized-template">
      <div class="admin-not-authorized">
        <span class="eyebrow">Restricted</span>
        <h2 style="font-family: var(--font-display); font-style: italic; margin: 0.5rem 0 1rem;">
          Admin access only.
        </h2>
        <p class="muted" style="margin-bottom: 1.5rem">
          You need to sign in with an admin account to manage the catalog.
        </p>
        <a class="btn btn-primary" href="/ui/pages/admin/index.html">Go to admin login</a>
      </div>
    </template>

    <template id="admin-table-template">
      <table class="admin-table">
        <thead>
          <tr>
            <th></th>
            <th>Name</th>
            <th>Category</th>
            <th>Price</th>
            <th>Stock</th>
            <th class="actions">Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </template>

    <template id="admin-table-row-template">
      <tr>
        <td><img class="thumb" alt=""></td>
        <td class="name-cell"></td>
        <td class="category-cell"></td>
        <td class="price-cell"></td>
        <td class="stock-cell"></td>
        <td class="actions">
          <button class="btn btn-ghost btn-sm" data-edit>Edit</button>
          <button class="btn btn-danger btn-sm" data-delete>Delete</button>
        </td>
      </tr>
    </template>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script type="module" src="./page.js"></script>
</body>
</html>
