<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — Atelier</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main>
    <div class="auth-page">
      <div class="auth-card admin">
        <span class="auth-eyebrow">Restricted area</span>
        <h1 class="auth-title">
          Admin portal
          <small>Sign in with an admin account to manage the catalog.</small>
        </h1>

        <form id="admin-login-form" novalidate>
          <div id="form-error" class="form-error" hidden></div>

          <div class="field">
            <label for="email">Admin email</label>
            <input id="email" name="email" type="email" required autocomplete="email">
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required autocomplete="current-password">
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg">Enter admin</button>
        </form>

        <div class="demo-creds">
          <strong>Demo admin</strong>
          <code>admin@atelier.shop</code> / <code>admin1234</code>
        </div>

        <p class="auth-foot">
          Not an admin? <a href="login.html">Use the regular login</a>
        </p>
      </div>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script type="module" src="js/pages/admin-login.js"></script>
</body>
</html>
